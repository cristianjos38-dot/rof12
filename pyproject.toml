[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rof12"
version = "0.1.0"
description = "ROF12 default-deny autonomous refund workflow"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "PyJWT>=2.8,<3",
  "Pillow>=10,<12",
  "pydantic>=2.5,<3",
  "pypdf>=4,<7",
  "pypdfium2>=4,<5",
  "psycopg[binary]>=3.1,<4",
  "reportlab>=4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

