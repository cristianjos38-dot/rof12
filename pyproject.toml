[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "rof12*"]

[project]
name = "rof12"
version = "1.0.0"
description = "ROF12 default-deny autonomous refund workflow"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "Jinja2>=3.1.5,<4",
  "anyio>=4.4.0,<5",
  "PyJWT>=2.8,<3",
  "Pillow>=13.0.0,<14",
  "pydantic>=2.5,<3",
  "pypdf>=4,<7",
  "pypdfium2>=4,<5",
  "psycopg[binary]>=3.1,<4",
  "reportlab>=4,<5",
  "sqlalchemy>=2.0,<3",
  "python-dotenv>=1.0.1,<2",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "httpx>=0.27,<1",
  "pip-audit>=2.9,<3",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "coverage[toml]>=7.6,<8",
  "pytest-cov>=6,<7",
]
voice = ["edge-tts>=6.1.0", "SpeechRecognition>=3.10.0"]
# PyAudio is platform-dependent; install it separately when microphone input
# is required (for example: python -m pip install pyaudio).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["rof12", "app"]
omit = [
  "rof12/agent.py",
  "rof12/audit.py",
  "rof12/demos.py",
  "rof12/gate.py",
  "rof12/inspector.py",
  "rof12/meta_client.py",
  "rof12/tools.py",
  "rof12/ui.py",
  "rof12/adapters/voice_adapter.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = [
  "app/security/policy_engine.py",
  "app/security/security_gate.py",
  "app/verification/verityflow.py",
  "rof12/core.py",
]

[tool.ruff.lint.per-file-ignores]
# Tests and local fixture/token helpers intentionally exercise insecure inputs;
# they must not be mistaken for production security findings.
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S105", "S106", "S311"]
# Frozen Pydantic contracts are intentionally left byte-for-byte unchanged;
# legacy typing spellings here are excluded from modernization lint rules.
"app/domain/**" = ["F401", "UP006", "UP035", "FA100", "UP017", "UP045"]
# FastAPI's dependency declarations are intentionally expressed in defaults.
"app/api/**" = ["B008", "FA100", "UP045"]

