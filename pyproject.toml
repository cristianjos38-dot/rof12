[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "demo*"]

[project]
name = "rof12"
version = "0.1.0"
description = "ROF12 default-deny autonomous refund workflow"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "Jinja2>=3.1.5,<4",
  "anyio>=4.4.0,<5",
  "PyJWT>=2.8,<3",
  "Pillow>=13.0.0,<14",
  "pydantic>=2.5,<3",
  "pypdf>=4,<7",
  "pypdfium2>=4,<5",
  "psycopg[binary]>=3.1,<4",
  "reportlab>=4,<5",
  "sqlalchemy>=2.0,<3",
  "python-dotenv>=1.0.1,<2",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Tests and local fixture/token helpers intentionally exercise insecure inputs;
# they must not be mistaken for production security findings.
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S105", "S106", "S311"]
# Frozen Pydantic contracts are intentionally left byte-for-byte unchanged;
# legacy typing spellings here are excluded from modernization lint rules.
"app/domain/**" = ["F401", "UP006", "UP035", "FA100", "UP017", "UP045"]
# FastAPI's dependency declarations are intentionally expressed in defaults.
"app/api/**" = ["B008", "FA100", "UP045"]

